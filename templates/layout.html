<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/css/main.css">
    {% block css %}{% endblock css %}
</head>
<body>
    <button id="toggle-btn" class="toggle-btn" onclick="toggleSidebar()">☰</button>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h1>My Menu</h1>
        </div>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('food_templates', user_id = 1) }}">Food Log</a>
        <a href="{{ url_for('exercise', user_id = 1) }}">Exercise</a>
        <a href="{{ url_for('sleep', user_id = 1) }}">Sleep</a>
        <a href="{{ url_for('weight', user_id = 1) }}">Weight</a>
        <a href="{{ url_for('analytics') }}">Analytics</a>
        <a href="{{ url_for('user_profile', user_id = 1) }}">Profile</a>
        <a href="{{ url_for('about') }}">About</a>
    </div>

    <div id="main" class="main">
        {% block content %}
        {% endblock content %}
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("hidden");
            document.getElementById("main").classList.toggle("shifted");

            const btn = document.getElementById("toggle-btn");
            if(document.getElementById("sidebar").classList.contains("hidden")){
                btn.style.left = "10px";
            }

            else{
                btn.style.left = "210px";
            }

        }
    </script>
</body>
</html>
