<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/main.css" />

    {% block css %}{% endblock css %}
  </head>

  <body>
    <!-- TOP BAR -->
    <div class="topbar d-flex justify-content-end gap-2 p-2">
      <a
        href="{{ url_for('login_page') }}"
        id="loginBtn"
        class="btn btn-outline-primary btn-sm"
      >
        Login
      </a>

      <a
        href="{{ url_for('register_page') }}"
        id="registerBtn"
        class="btn btn-primary btn-sm"
      >
        Register
      </a>

      <button id="logoutBtn" class="btn btn-danger btn-sm d-none">
        Logout
      </button>
    </div>

    <!-- SIDEBAR TOGGLE -->
    <button id="toggle-btn" class="toggle-btn" onclick="toggleSidebar()">
      ☰
    </button>

    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h1>My Menu</h1>
      </div>

      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('food_templates') }}">Food Log</a>
      <a href="{{ url_for('exercise') }}">Exercise</a>
      <a href="{{ url_for('sleep') }}">Sleep</a>
      <a href="{{ url_for('weight') }}">Weight</a>
      <a href="{{ url_for('analytics') }}">Analytics</a>
      <a href="{{ url_for('user_profile') }}">Profile</a>
      <a href="{{ url_for('about') }}">About</a>
    </div>

    <div id="main" class="main">{% block content %}{% endblock content %}</div>

    <!-- Success Modal -->
    <div
      class="modal fade"
      id="successModal"
      tabindex="-1"
      aria-labelledby="successModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title" id="successModalLabel">Success</h5>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <p id="successMessage" class="fs-5 mb-0"></p>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Error Modal -->
    <div
      class="modal fade"
      id="errorModal"
      tabindex="-1"
      aria-labelledby="errorModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="errorModalLabel">Error</h5>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <p id="errorMessage" class="fs-5 mb-0"></p>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SIDEBAR TOGGLE -->
    <script>
      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("hidden");
        document.getElementById("main").classList.toggle("shifted");

        const btn = document.getElementById("toggle-btn");
        if (document.getElementById("sidebar").classList.contains("hidden")) {
          btn.style.left = "10px";
        } else {
          btn.style.left = "210px";
        }
      }
    </script>

    <!-- AUTH LOGIC -->
    <script>
      function updateAuthUI() {
        const token = localStorage.getItem("access_token");

        const loginBtn = document.getElementById("loginBtn");
        const registerBtn = document.getElementById("registerBtn");
        const logoutBtn = document.getElementById("logoutBtn");

        if (token) {
          loginBtn.classList.add("d-none");
          registerBtn.classList.add("d-none");
          logoutBtn.classList.remove("d-none");
        } else {
          loginBtn.classList.remove("d-none");
          registerBtn.classList.remove("d-none");
          logoutBtn.classList.add("d-none");
        }
      }

      document.getElementById("logoutBtn").addEventListener("click", async () => {
        localStorage.removeItem("access_token");
        await fetch("/api/users/logout", {method: "POST"});
        updateAuthUI();
        window.location.href = "/login";
      });

      // run on page load
      updateAuthUI();
    </script>

    <script>
        
    </script>

    {% block scripts %}{% endblock scripts %}
  </body>
</html>
