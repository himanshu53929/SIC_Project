{% extends "layout.html" %}

{% block css %}
<style>
    body {
        background: #f4f6f8;
    }

    .profile-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 20px;
    }

    .profile-card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border-radius: 16px;
        padding: 25px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(0,0,0,0.12);
    }

    .profile-title {
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #333;
    }

    .profile-item {
        display: flex;
        justify-content: space-between;
        padding: 12px 10px;
        margin: 8px 0;
        border-radius: 8px;
        background: #f9fafb;
        transition: background 0.2s;
    }

    .profile-item:hover {
        background: #eef2ff;
    }

    .label {
        font-weight: 600;
        color: #555;
    }

    .value {
        font-weight: 500;
        color: #111;
    }

    .profile-footer {
        margin-top: 20px;
        text-align: center;
    }

    .btn {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        background: #4f46e5;
        color: white;
        font-weight: 500;
        transition: 0.3s;
        text-decoration: none;
    }

    .btn:hover {
        background: #3730a3;
    }
</style>
{% endblock css %}

{% block content %}
<div class="profile-wrapper">
    <div class="profile-card">

        <div class="profile-title">
            👤 User Profile
        </div>

        <div class="profile-item">
            <span class="label">Name</span>
            <span class="value">{{ user.username }}</span>
        </div>

        <div class="profile-item">
            <span class="label">Age</span>
            <span class="value">{{ user.age }}</span>
        </div>

        <div class="profile-item">
            <span class="label">Gender</span>
            <span class="value">{{ user.gender }}</span>
        </div>

        <div class="profile-item">
            <span class="label">Weight</span>
            <span class="value">{{ user.weight_kg }} kg</span>
        </div>

        <div class="profile-item">
            <span class="label">Height</span>
            <span class="value">{{ user.height_cm }} cm</span>
        </div>

        <div class="profile-item">
            <span class="label">Goal</span>
            <span class="value">{{ user.goal }}</span>
        </div>

        <div class="profile-footer">
            <a href="#" class="btn">Edit Profile</a>
        </div>

    </div>
</div>
{% endblock content %}
