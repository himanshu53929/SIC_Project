{% extends "layout.html" %}

{% block css %}
<style>
  .auth-container {
    max-width: 420px;
    margin: 60px auto;
    padding: 30px;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    transition: transform 0.2s ease;
  }

  .auth-container:hover {
    transform: translateY(-2px);
  }

  .auth-title {
    text-align: center;
    margin-bottom: 25px;
    font-weight: 600;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .auth-container label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: #333;
  }

  .auth-container input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    transition: all 0.2s ease;
  }

  .auth-container input:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 3px rgba(13,110,253,0.15);
  }

  /* ✅ FIX: scope button ONLY inside auth container */
  .auth-container button[type="submit"] {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #0d6efd;
    color: white;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .auth-container button[type="submit"]:hover {
    background: #0b5ed7;
  }

  .auth-footer {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
  }

  .auth-footer a {
    color: #0d6efd;
    text-decoration: none;
  }

  .auth-footer a:hover {
    text-decoration: underline;
  }
</style>
{% endblock css %}

{% block content %}
<div class="auth-container">
  <h2 class="auth-title">Login</h2>

  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="text" name="username" id="username" required />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" id="password" required />
    </div>

    <button type="submit">Login</button>
  </form>

  <div class="auth-footer">
    Don't have an account?
    <a href="{{ url_for('register_page') }}">Register</a>
  </div>
</div>
{% endblock content %}

{% block scripts %}
<script type="module">
import { getErrorMessage, showModal } from "/static/js/utils.js";

const loginForm = document.getElementById("loginForm");

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const formData = new FormData(loginForm);

  // Here we don't convert the formData to json because OAuth2PasswordRequestForm expects formdata
  try {
    const response = await fetch("/api/users/token", {
      method: "POST",
      body: formData,
    });

    if (response.ok) {
      const data = await response.json();

      localStorage.setItem("access_token", data.access_token);

      document.getElementById("successMessage").textContent =
        "Login successful!";
      showModal("successModal");

      document
        .getElementById("successModal")
        .addEventListener(
          "hidden.bs.modal",
          () => (window.location.href = "/"),
          { once: true }
        );
    } else {
      const error = await response.json();
      document.getElementById("errorMessage").textContent =
        getErrorMessage(error);
      showModal("errorModal");
    }
  } catch (err) {
    document.getElementById("errorMessage").textContent =
      "Network error. Try again.";
    showModal("errorModal");
  }
});
</script>
{% endblock scripts %}
